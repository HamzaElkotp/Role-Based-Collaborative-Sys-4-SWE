services:
  db:
    image: postgres:16-alpine
    container_name: invitation-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: invitation_service_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d invitation_service_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  invitation-service:
    build:
      context: ..
      dockerfile: Dockerfile.service
      args:
        MODULE: InvitationService
    container_name: invitation-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/invitation_service_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      APP_INVITATION_PUBLIC_BASE_URL: http://localhost:8083/api/invitations/
    ports:
      - "8083:8083"
