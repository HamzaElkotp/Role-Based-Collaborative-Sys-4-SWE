spring.application.name=api-gateway
server.port=8080

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true

spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://auth-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[1].id=task-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://task-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/projects/*/tasks/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[2].id=team-role-service-roles
spring.cloud.gateway.server.webflux.routes[2].uri=lb://team-role-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/roles/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[3].id=team-role-service-members
spring.cloud.gateway.server.webflux.routes[3].uri=lb://team-role-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/projects/*/members/**,/api/projects/*/memberships/**
spring.cloud.gateway.server.webflux.routes[3].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[4].id=project-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://project-service
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/projects/**
spring.cloud.gateway.server.webflux.routes[4].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[5].id=reviewing-phase-service
spring.cloud.gateway.server.webflux.routes[5].uri=lb://reviewing-phase-service
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/reviews/**
spring.cloud.gateway.server.webflux.routes[5].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[6].id=testing-phase-service
spring.cloud.gateway.server.webflux.routes[6].uri=lb://testing-phase-service
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/api/testing/**
spring.cloud.gateway.server.webflux.routes[6].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[7].id=notification-service
spring.cloud.gateway.server.webflux.routes[7].uri=lb://notification-service
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/api/notifications/**
spring.cloud.gateway.server.webflux.routes[7].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[8].id=invitation-service
spring.cloud.gateway.server.webflux.routes[8].uri=lb://invitation-service
spring.cloud.gateway.server.webflux.routes[8].predicates[0]=Path=/api/invitations/**
spring.cloud.gateway.server.webflux.routes[8].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[9].id=pipeline-service
spring.cloud.gateway.server.webflux.routes[9].uri=lb://pipeline-service
spring.cloud.gateway.server.webflux.routes[9].predicates[0]=Path=/api/pipeline/**
spring.cloud.gateway.server.webflux.routes[9].filters[0]=RewritePath=/api/pipeline/?(?<segment>.*),/updates/$\{segment}

spring.cloud.gateway.server.webflux.routes[10].id=modifying-phase-service
spring.cloud.gateway.server.webflux.routes[10].uri=lb://modifying-phase-service
spring.cloud.gateway.server.webflux.routes[10].predicates[0]=Path=/api/modifying/**
spring.cloud.gateway.server.webflux.routes[10].filters[0]=RewritePath=/api/modifying/?(?<segment>.*),/updates/$\{segment}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
